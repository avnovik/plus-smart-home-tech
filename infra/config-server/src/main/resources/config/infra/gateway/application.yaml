spring:
  cloud:
    gateway:
      # Gateway для своей работы должен использовать Discovery Service.
      discovery:
        locator:
          enabled: true
      routes:
        - id: shopping_cart_service_route
          uri: lb://shopping-cart

          predicates:
            - Path=/shopping-cart/**
          filters:
            - PrefixPath=/api/v1

        - id: shopping_store_service_route
          uri: lb://shopping-store

          predicates:
            - Path=/shopping-store/**
          filters:
            - PrefixPath=/api/v1
            - name: Retry
              args:
                retries: 3
                methods: GET
                statuses: NOT_FOUND
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: true

server:
  port: 8080

logging:
  level:
    # 1-2 строки на каждый входящий HTTP-запрос в Gateway (метод + путь + статус).
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
